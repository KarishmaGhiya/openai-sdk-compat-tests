name: Watch openai npm releases

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      release_tests_from:
        description: Ask Copilot for tests for every feature release from this version (blank uses the RELEASE_TESTS_FROM variable)
        type: string
        default: ''
permissions:
  contents: read

concurrency:
  group: openai-release-watch
  cancel-in-progress: false

jobs:
  dispatch:
    if: vars.RELEASE_WATCH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - id: release
        run: node scripts/release-watch.mjs
        env:
          NPM_REGISTRY: https://registry.npmjs.org
      - name: Run live tests for the newest release and its predecessor once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS: ${{ steps.release.outputs.previous }}
          LATEST: ${{ steps.release.outputs.latest }}
        run: |
          title="openai $PREVIOUS vs $LATEST"
          seen="$(gh run list --workflow azure-compat-live.yml --limit 200 --json displayTitle \
            --jq "[.[] | select(.displayTitle | endswith(\"$title\"))] | length")"
          if [ "$seen" -gt 0 ]; then
            echo "Live tests already ran or are queued for $title."
            exit 0
          fi
          gh workflow run azure-compat-live.yml --ref main -f confirm_paid_tests=true -f mode=responses-core \
            -f baseline_version="$PREVIOUS" -f current_version="$LATEST"
          echo "::notice::Dispatched live tests for $title."

  request-tests:
    if: vars.RELEASE_WATCH_ENABLED != 'false' && (inputs.release_tests_from || vars.RELEASE_TESTS_FROM) != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Signs in via OIDC to read the fine-grained user token that can assign issues to the Copilot coding agent.
    environment: compat-issues
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Open a Copilot-assigned issue for each new feature release
        env:
          AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
          COPILOT_AGENT_TOKEN_SECRET_NAME: ${{ vars.COPILOT_AGENT_TOKEN_SECRET_NAME || 'copilot-agent-token' }}
          RELEASE_TESTS_FROM: ${{ inputs.release_tests_from || vars.RELEASE_TESTS_FROM }}
          NPM_REGISTRY: https://registry.npmjs.org
        # The token stays in this shell's memory and is passed only to the node process.
        run: |
          COPILOT_AGENT_TOKEN="$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name "$COPILOT_AGENT_TOKEN_SECRET_NAME" --query value -o tsv 2>/dev/null)" ||
            { echo "::error::Could not read $COPILOT_AGENT_TOKEN_SECRET_NAME from Key Vault."; exit 1; }
          echo "::add-mask::$COPILOT_AGENT_TOKEN"
          COPILOT_AGENT_TOKEN="$COPILOT_AGENT_TOKEN" node scripts/request-release-tests.mjs
