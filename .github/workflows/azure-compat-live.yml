name: Azure and OpenAI live compatibility

on:
  workflow_dispatch:
    inputs:
      confirm_paid_tests:
        description: Authorize paid API calls for the selected mode
        type: boolean
        required: true
        default: false
      mode:
        description: Run configured suites, all nine core Responses methods, or stable Azure companion scenarios
        type: choice
        options: [configured, responses-core, azure-companion]
        default: configured
      companion_features:
        description: Companion mode only; comma-separated chat, chat-stream, grounding, grounding-stream, completions, images, upload-parts
        type: string
        default: chat,chat-stream
      responses_features:
        description: Optional comma-separated feature IDs in responses-core mode; blank runs all nine methods
        type: string
        default: ''
      companion_chat_deployment:
        description: Companion mode only; optional chat deployment override, without modifying Key Vault
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: azure-openai-live-compat
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main' && inputs.confirm_paid_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: openai-live
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:azure
      - run: npm run test:responses
      - run: npm run responses:report
        env:
          AZURE_COMPAT_MODE: ${{ inputs.mode }}
      - name: Save offline SDK compatibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sdk-compatibility-details
          path: reports/responses-compatibility.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Locate live test logs
        if: inputs.mode == 'responses-core'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log_url=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "live") | .html_url as $url | .steps[] | select(.name == "Fetch Key Vault configuration in memory and run live tests") | "\($url)#step:\(.number):1"' 2>/dev/null) || log_url=""
          echo "RESPONSES_LIVE_LOG_URL=${log_url:-https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Fetch Key Vault configuration in memory and run live tests
        run: npm run test:azure:keyvault
        env:
          ALLOW_LIVE_API: 'true'
          AZURE_LOG_LEVEL: error
          OPENAI_LOG: 'off'
          AZURE_COMPAT_MODE: ${{ inputs.mode }}
          RESPONSES_LIVE_FEATURES: ${{ inputs.responses_features }}
          AZURE_COMPANION_FEATURES: ${{ inputs.companion_features }}
          AZURE_COMPANION_CHAT_DEPLOYMENT: ${{ inputs.companion_chat_deployment }}
          AZURE_KEYVAULT_URL: ${{ vars.AZURE_KEYVAULT_URL }}
          AZURE_COMPAT_SECRET_NAME: ${{ vars.AZURE_COMPAT_SECRET_NAME || 'openai-azure-compat-config' }}
          COMPAT_SUMMARY_DEFERRED: ${{ inputs.mode == 'responses-core' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: azure-live-results
          path: reports/azure-live.json
          if-no-files-found: ignore
          retention-days: 7

  summary:
    needs: live
    if: always() && needs.live.result != 'skipped' && inputs.mode == 'responses-core'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Signs in via OIDC as id-compat-issues, which can read only the issue-filing GitHub App key; no live API secrets.
    environment: compat-issues
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: azure-live-results
          path: reports
      - uses: azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f # v3
        id: azure
        if: vars.ISSUES_APP_CLIENT_ID != ''
        continue-on-error: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: File failure issues and write results table linked to exact log lines
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_LOGIN_OUTCOME: ${{ steps.azure.outcome }}
          AZURE_KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME }}
          ISSUES_APP_KEY_SECRET_NAME: ${{ vars.ISSUES_APP_KEY_SECRET_NAME }}
          ISSUES_APP_CLIENT_ID: ${{ vars.ISSUES_APP_CLIENT_ID }}
          OPENAPI_ISSUE_REPO: KarishmaGhiya/openai-openapi
          SDK_ISSUE_REPO: KarishmaGhiya/openai-node
          AZURE_ISSUE_REPO: KarishmaGhiya/azure-rest-api-specs
        # The App key stays in this shell's memory and is passed only to the node process, which mints a one-hour token.
        run: |
          if [ "$AZURE_LOGIN_OUTCOME" = success ]; then
            ISSUES_APP_PRIVATE_KEY="$(az keyvault secret show --vault-name "$AZURE_KEYVAULT_NAME" --name "$ISSUES_APP_KEY_SECRET_NAME" --query value -o tsv 2>/dev/null)" ||
              { echo "::warning::Could not read the issue-filing App key from Key Vault."; ISSUES_APP_PRIVATE_KEY=""; }
            export ISSUES_APP_PRIVATE_KEY
          fi
          node scripts/responses-summary.mjs
